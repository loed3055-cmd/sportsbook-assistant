# Weekly dependency updates (SSDF PW.4 / PO.3.2).
# "uv" updates pyproject.toml + uv.lock; after merging, run `make lock` so the
# requirements/*.txt exports match (the CI audit job fails until they do).
# requirements/pickem.txt holds floors only and is bumped by hand with the
# `pickem` extra; a pip entry here would also rewrite the generated exports.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
