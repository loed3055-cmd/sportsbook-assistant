# Used by `make test`. Run with an explicit project name (-p sportsbook-test)
# so it never shares a pod with the dev stack in this directory.
services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    # app/config.py builds DATABASE_URL from these; DATABASE_URL itself is ignored.
    # Throwaway credentials for an ephemeral local test DB only.
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportsbook_test

  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportsbook_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportsbook_test"]
      interval: 2s
      timeout: 3s
      retries: 15
